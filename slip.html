<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1d21">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slip Gaji AWB</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  /* Host render PDF: lebar tetap (px) dan menempel di kiri atas agar tidak terpotong */
  #pdfRenderHost {
    position: fixed;
    top: 0;
    left: 0;
    width: 720px;
    z-index: -1;
    pointer-events: none;
    background: #fff;
  }
  #pdfRenderHost .slip {
    width: 720px;
    margin: 0;
    padding: 24px 28px 20px;
    border: none;
    border-radius: 0;
    background: #fff;
    box-sizing: border-box;
  }
  #pdfRenderHost .slip td { font-size: 14px; }

  /* Kunci layout tabel agar tidak meluber */
  .slip table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .slip td:first-child { width: 58%; word-wrap: break-word; }
  .slip td:last-child { width: 42%; text-align: right; white-space: nowrap; }

  /* CSS Modal Import */
  #import-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
    z-index: 10000; display: none; align-items: flex-end; justify-content: center;
  }
  .import-content {
    background: #fff; width: 100%; max-width: 600px; max-height: 85vh;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  }
  .import-header {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .import-body {
    padding: 16px; overflow-y: auto; flex: 1;
  }
  .import-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 0;
    border-bottom: 1px dashed var(--line);
  }
  .import-item input[type="checkbox"] {
    width: 20px; height: 20px; accent-color: var(--wine);
  }
  .import-item-info { flex: 1; }
  .import-item-info b { display: block; font-size: 14px; }
  .import-item-info small { color: var(--mute); font-size: 12px; }
  .import-footer {
    padding: 16px; border-top: 1px solid var(--line);
    display: flex; gap: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="hbtns" style="left:12px; right:auto;">
    <button onclick="location.href='./index.html'">← Menu</button>
  </div>
  <div class="hbtns">
    <button onclick="resetData()">Reset</button>
  </div>
  <h1>Slip Gaji AWB</h1>
  <div class="couple">PT. Agriwangi Berry</div>
  <div style="margin-top:8px"><span id="cn" class="badge">🟢 Siap Digunakan</span></div>
</header>

<div id="st"></div>
<main id="m"></main>

<nav>
  <button onclick="switchTab('home')" id="nav-home" class="on"><div class="ic">🏠</div>Home</button>
  <button onclick="switchTab('data')" id="nav-data"><div class="ic">📋</div>Data Pekerja</button>
  <button onclick="switchTab('setting')" id="nav-setting"><div class="ic">⚙️</div>Pengaturan</button>
</nav>

<div id="import-modal">
  <div class="import-content">
    <div class="import-header">
      <b>Pilih Pekerja yang Di-import</b>
      <button onclick="document.getElementById('import-modal').style.display='none'" style="background:none; border:0; font-size:24px; cursor:pointer;">&times;</button>
    </div>
    <div class="import-body" id="import-list"></div>
    <div class="import-footer">
      <button onclick="document.getElementById('import-modal').style.display='none'" style="flex:1; padding:12px; border:1px solid var(--line); background:#eee; border-radius:10px; font-weight:600;">Batal</button>
      <button onclick="confirmImport()" style="flex:2; padding:12px; border:0; background:var(--wine); color:#fff; border-radius:10px; font-weight:600;">Import Terpilih</button>
    </div>
  </div>
</div>

<div id="pdfRenderHost"></div>

<script>
const COMPANY = 'PT. AGRI WANGI BERRY';
const STORE = 'slip-upah-pwa-v1';
let currentTab = 'home';
let workers = [];
let parsedWorkers = []; 

const DEFAULT_WORKERS = [
  {n:'Agyl Agniya', i:'54401100323506', k:'Grower GH 1', h:'26', j:'7', m:'0', r:'0', p:'0', a:'', b:'', c:''}
];

const $ = id => document.getElementById(id);
const rp = n => (n || n === 0) && Number(n) !== 0 ? 'Rp ' + Math.round(n).toLocaleString('id-ID') : 'Rp -';
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(t) {
  const e = $('st'); e.textContent = t; e.style.display = 'block';
  clearTimeout(window._tt); window._tt = setTimeout(() => e.style.display = 'none', 2500);
}

function getSetting(k) {
  const s = JSON.parse(localStorage.slip_settings || '{}');
  return s[k] || { periode: 'September 2026', tHari: 94200, tLembur: 18000, tMerah: 117750 }[k];
}

function calc(w) {
  const tH = w.a !== '' ? num(w.a) : getSetting('tHari');
  const tL = w.b !== '' ? num(w.b) : getSetting('tLembur');
  const tM = w.c !== '' ? num(w.c) : getSetting('tMerah');
  
  const hadir = Math.round(num(w.h) * tH);
  const jamLemb = num(w.j) + num(w.m) / 60;
  const lembur = Math.round(jamLemb * tL);
  const merah = Math.round(num(w.r) * tM);
  const pot = num(w.p);
  
  return { tH, tL, tM, hadir, lembur, merah, pot, total: hadir + lembur + merah - pot };
}

function fmtLembur(w) {
  const j = num(w.j), m = num(w.m);
  if (!j && !m) return '-';
  if (!m) return j + ' Jam';
  return j + ' Jam ' + m + ' Menit';
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
  $('nav-' + tab).classList.add('on');
  drawPage();
}

function drawPage() {
  const m = $('m');
  
  if (currentTab === 'home') {
    let total = 0;
    workers.forEach(w => total += calc(w).total);
    
    const options = workers.filter(w => w.n && w.n.trim()).map(w => {
       const idx = workers.indexOf(w);
       return `<option value="${idx}">${esc(w.n)} (${esc(w.k)})</option>`;
    }).join('');

    m.innerHTML = `
      <div class="grid" style="margin-bottom:12px">
        <div class="card"><div class="mute">Total Gaji</div><div class="num" style="font-size:18px;color:var(--wine)">${rp(total)}</div></div>
        <div class="card"><div class="mute">Pekerja</div><div class="num" style="font-size:18px">${workers.length} org</div></div>
      </div>
      <div class="card">
        <div class="row"><b>Generator PDF</b></div>
        
        <label class="mute" style="font-size:12px; margin:10px 0 4px; display:block;">Pilih Karyawan:</label>
        <select id="pdf-select" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line); background:#fff; font-family:inherit;">
          <option value="">-- Pilih Nama --</option>
          ${options}
        </select>
        <button style="width:100%; background:var(--wine); color:#fff; border:0; border-radius:10px; padding:12px; font:600 15px Figtree,sans-serif; margin-bottom:10px;" onclick="downloadSelectedPDF()">📥 Download PDF Terpilih</button>
        
        <hr style="border:0; border-top:1px dashed var(--line); margin:16px 0;">
        
        <button style="width:100%; border:1px solid var(--wine); background:none; color:var(--wine); border-radius:10px; padding:14px; font:600 16px Figtree,sans-serif; margin-bottom:10px;" onclick="saveAllPDF()">📥 Download Semua PDF</button>
      </div>
    `;
  } 
  else if (currentTab === 'data') {
    let html = `
      <div class="card" style="background:#e8f4ea; border-color:#b8d8be; margin-bottom:14px;">
        <b style="color:var(--sage)">Import dari Excel</b>
        <p class="mute" style="margin:6px 0; font-size:12px;">Upload file Excel Anda. Sistem akan mendeteksi nama dan menampilkan checklist sebelum di-import.</p>
        <input type="file" id="excel-input" accept=".xlsx, .xls" onchange="handleExcelUpload(event)" style="width:100%; padding:8px; background:#fff; border:1px solid #b8d8be; border-radius:8px;">
      </div>
      <button onclick="addWorker()" style="padding:11px;border-radius:10px;font:600 14px Figtree,sans-serif;width:100%;border:1px dashed var(--wine);background:none;color:var(--wine);margin-bottom:12px">+ Tambah Pekerja Manual</button>
    `;
    
    workers.forEach((w, idx) => {
      const c = calc(w);
      html += `
        <div class="card" style="padding:12px; margin-bottom:8px;">
          <div class="row" style="margin-bottom:8px">
            <input type="text" value="${esc(w.n)}" placeholder="Nama" onchange="updateW(${idx},'n',this.value)" style="font-weight:600; border:0; border-bottom:1px dashed var(--line); padding:4px;">
            <button onclick="delWorker(${idx})" style="border:0;background:none;color:#a33;font-size:18px">🗑️</button>
          </div>
          <div class="grid" style="gap:8px">
            <div><label class="mute" style="font-size:11px">Kategori</label><input type="text" value="${esc(w.k)}" onchange="updateW(${idx},'k',this.value)"></div>
            <div><label class="mute" style="font-size:11px">Rekening</label><input type="text" value="${esc(w.i)}" onchange="updateW(${idx},'i',this.value)"></div>
            <div><label class="mute" style="font-size:11px">Hadir (Hari)</label><input type="number" value="${esc(w.h)}" onchange="updateW(${idx},'h',this.value)"></div>
            <div>
              <label class="mute" style="font-size:11px">Lembur (J/M)</label>
              <div style="display:flex; gap:4px">
                <input type="number" value="${esc(w.j)}" placeholder="Jam" onchange="updateW(${idx},'j',this.value)">
                <input type="number" value="${esc(w.m)}" placeholder="Mnt" onchange="updateW(${idx},'m',this.value)">
              </div>
            </div>
          </div>
          <details style="margin-top:10px; border-top:1px solid var(--line); padding-top:8px">
            <summary class="mute" style="font-size:12px;cursor:pointer">Tarif Khusus / Potongan</summary>
            <div class="grid" style="margin-top:8px">
              <div><label class="mute" style="font-size:11px">Upah/Hari</label><input type="number" value="${esc(w.a)}" placeholder="${getSetting('tHari')}" onchange="updateW(${idx},'a',this.value)"></div>
              <div><label class="mute" style="font-size:11px">Potongan (Rp)</label><input type="number" value="${esc(w.p)}" onchange="updateW(${idx},'p',this.value)"></div>
            </div>
          </details>
          <div class="row" style="margin-top:10px; border-top:1px dashed var(--line); padding-top:8px">
            <span class="mute">Total Diterima</span>
            <div style="display:flex; gap:8px; align-items:center;">
              <strong style="color:var(--wine)">${rp(c.total)}</strong>
              <button onclick="saveSlipPDF(workers[${idx}])" style="border:1px solid var(--wine); background:none; color:var(--wine); border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; font-weight:600;">📥 PDF</button>
            </div>
          </div>
        </div>
      `;
    });
    m.innerHTML = html;
  }
  else if (currentTab === 'setting') {
    const s = JSON.parse(localStorage.slip_settings || '{}');
    const tHari = s.tHari || 94200;
    const tLembur = s.tLembur || 18000;
    const tMerah = s.tMerah || 117750;
    const periode = s.periode || 'September 2026';
    
    m.innerHTML = `
      <div class="card">
        <h3 style="margin:0 0 12px;font-family:Fraunces,serif;color:var(--wine)">Pengaturan Global</h3>
        <label>Periode Cetak</label>
        <input type="text" id="set-periode" value="${periode}">
        <label style="margin-top:10px">Upah Standar / Hari (Rp)</label>
        <input type="number" id="set-thari" value="${tHari}">
        <label style="margin-top:10px">Lembur / Jam (Rp)</label>
        <input type="number" id="set-tlembur" value="${tLembur}">
        <label style="margin-top:10px">Upah Tanggal Merah / Hari (Rp)</label>
        <input type="number" id="set-tmerah" value="${tMerah}">
        
        <button onclick="saveSetting()" style="margin-top:20px; width:100%; padding:13px; border:0; border-radius:10px; background:var(--wine); color:#fff; font:600 15px Figtree,sans-serif">Simpan Pengaturan</button>
      </div>
    `;
  }
}

// ===== FITUR IMPORT EXCEL =====
async function handleExcelUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      
      const sheetList = workbook.SheetNames.join(', ');
      const defaultSheet = workbook.SheetNames[workbook.SheetNames.length - 1];
      const selectedSheet = prompt(`Pilih nama Sheet yang ingin di-import:\n(Tersedia: ${sheetList})`, defaultSheet);
      
      if (!selectedSheet || !workbook.Sheets[selectedSheet]) {
        return toast('Sheet tidak ditemukan / dibatalkan');
      }

      const sheet = workbook.Sheets[selectedSheet];
      const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ''});
      
      parsedWorkers = [];
      let currentCategory = 'Grower';
      let colMap = null;
      let isStopped = false; 

      rows.forEach(row => {
        if (!row || row.length === 0) return;
        const rowStr = row.map(c => String(c || '').trim().toUpperCase());
        const bCell = String(row[1] || '').trim();

        if (bCell.toUpperCase() === 'SUMMARY') {
           isStopped = true;
           colMap = null;
           return;
        }

        if (bCell.toLowerCase().startsWith('upah ')) {
          currentCategory = bCell.substring(5).trim();
          isStopped = false; 
          colMap = null;
          return;
        }

        if (isStopped) return;

        const isHeader = rowStr.includes('NAMA') && rowStr.some(c => c.includes('KEHADIRAN'));
        if (isHeader) {
          colMap = {
            n: rowStr.findIndex(c => c === 'NAMA'),
            h: rowStr.findIndex(c => c.includes('KEHADIRAN') && !c.includes('LEMBUR') && !c.includes('MERAH') && !c.includes('PIKET')),
            a: rowStr.findIndex(c => c.includes('UPAH') && (c.includes('HARI') || c.includes('SHIFT'))),
            j: rowStr.findIndex(c => c.includes('LEMBUR') && !c.includes('NOMINAL') && !c.includes('TOTAL')),
            r: rowStr.findIndex(c => c.includes('MERAH') && !c.includes('NOMINAL') && !c.includes('TOTAL')),
            i: rowStr.findIndex(c => c.includes('REKENING') || c.includes('BRI'))
          };
          return;
        }

        if (colMap && colMap.n !== -1) {
          const name = String(row[colMap.n] || '').trim();
          
          if (!name || name.toUpperCase() === 'NAMA' || name.toUpperCase() === 'NO' || name.toLowerCase().includes('total')) return;

          let rawH = String(row[colMap.h] || '').trim();
          if (rawH.includes('Rp') || rawH.includes(',')) return;

          let j = 0, m = 0;
          if (colMap.j !== -1) {
            const rawJ = String(row[colMap.j] || '').replace(',', '.').trim();
            if (rawJ && !isNaN(parseFloat(rawJ)) && !rawJ.includes('Rp')) {
              if (rawJ.includes('.')) {
                const parts = rawJ.split('.');
                j = parseInt(parts[0]) || 0;
                let mStr = parts[1].substring(0, 2);
                if (mStr.length === 1) mStr += '0';
                m = parseInt(mStr) || 0;
                if (m >= 60) m = 0;
              } else {
                j = parseInt(rawJ) || 0;
              }
            }
          }

          const rek = colMap.i !== -1 ? String(row[colMap.i] || '').trim() : '';
          const merah = colMap.r !== -1 ? String(row[colMap.r] || '').replace(/[^0-9]/g, '') : '0';
          
          let upah = '';
          if (colMap.a !== -1) {
            const rawUpah = String(row[colMap.a] || '').replace(/[^0-9]/g, ''); 
            if (rawUpah && rawUpah !== '0') upah = rawUpah;
          }

          const hadir = rawH.replace(/[^0-9]/g, '') || '0';

          parsedWorkers.push({
            n: name, i: rek, k: currentCategory, h: hadir,
            j: String(j), m: String(m), r: merah, p: '0', a: upah, b: '', c: ''
          });
        }
      });

      if (parsedWorkers.length > 0) {
        showImportChecklist(selectedSheet);
      } else {
        alert('Tidak ada data yang terbaca dari Sheet ini. Pastikan format tabel Excel sesuai.');
      }

    } catch (err) {
      console.error(err);
      alert('Gagal membaca file Excel. Pastikan file tidak rusak.');
    }
    
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function showImportChecklist(sheetName) {
  const list = $('import-list');
  list.innerHTML = '';

  const ignoreWords = ['grower gh 1', 'grower gh 2', 'grower gh 1', 'processing', 'satpam', 'house keeping', 'housekeeping', 'grower fertigasi'];

  parsedWorkers.forEach((w, i) => {
    const isLikelyNotName = ignoreWords.some(word => w.n.toLowerCase().includes(word));
    
    const div = document.createElement('div');
    div.className = 'import-item';
    div.innerHTML = `
      <input type="checkbox" id="imp-${i}" ${isLikelyNotName ? '' : 'checked'} onchange="updateImportCount()">
      <div class="import-item-info">
        <b>${esc(w.n)}</b>
        <small>Kategori: ${esc(w.k)} | Hadir: ${w.h} Hari</small>
      </div>
      <label for="imp-${i}" style="font-size:12px; color:var(--mute);">Pilih</label>
    `;
    list.appendChild(div);
  });

  document.querySelector('.import-header b').textContent = `Pilih Pekerja (Sheet: ${sheetName})`;
  $('import-modal').style.display = 'flex';
  
  const btn = document.querySelector('.import-footer button[onclick="confirmImport()"]');
  updateImportCount(btn);
}

function updateImportCount(btn) {
  if(!btn) btn = document.querySelector('.import-footer button[onclick="confirmImport()"]');
  const checkedCount = document.querySelectorAll('#import-list input[type="checkbox"]:checked').length;
  btn.textContent = `Import ${checkedCount} Pekerja Terpilih`;
}

function confirmImport() {
  const selected = [];
  const checkboxes = document.querySelectorAll('#import-list input[type="checkbox"]');
  
  checkboxes.forEach((cb, i) => {
    if (cb.checked) selected.push(parsedWorkers[i]);
  });

  if (selected.length === 0) {
    return alert('Pilih minimal 1 pekerja untuk di-import.');
  }

  if (confirm(`Ganti data saat ini dengan ${selected.length} pekerja terpilih?`)) {
    workers = selected;
    saveToLocal();
    $('import-modal').style.display = 'none';
    drawPage();
    switchTab('data'); 
    toast('Data berhasil diimport!');
  }
}

function updateW(idx, key, val) {
  workers[idx][key] = val;
  saveToLocal();
  drawPage();
}

function addWorker() {
  workers.push({n:'', i:'', k:'Grower', h:'0', j:'0', m:'0', r:'0', p:'0', a:'', b:'', c:''});
  saveToLocal();
  drawPage();
}

function delWorker(idx) {
  if (confirm('Hapus pekerja ini?')) {
    workers.splice(idx, 1);
    saveToLocal();
    drawPage();
  }
}

function saveSetting() {
  const s = {
    periode: $('set-periode').value,
    tHari: num($('set-thari').value),
    tLembur: num($('set-tlembur').value),
    tMerah: num($('set-tmerah').value)
  };
  localStorage.slip_settings = JSON.stringify(s);
  toast('Pengaturan disimpan');
  drawPage();
}

function resetData() {
  if (confirm('Kembalikan ke data awal? Semua perubahan akan hilang.')) {
    workers = JSON.parse(JSON.stringify(DEFAULT_WORKERS));
    saveToLocal();
    drawPage();
    toast('Data direset');
  }
}

function saveToLocal() {
  localStorage.setItem(STORE, JSON.stringify(workers));
}

function slipHTML(w) {
  const c = calc(w);
  const kat = (w.k || 'Grower').toUpperCase();
  const periode = getSetting('periode');
  
  return `<div class="slip">
    <h3>${COMPANY}</h3>
    <h4>SLIP UPAH ${kat}</h4>
    <div class="per">Periode : <strong>${periode}</strong></div>
    <table>
      <tr><td>Nama</td><td>: ${esc(w.n)}</td></tr>
      <tr><td>Rekening BRI</td><td>: ${esc(w.i || '-')}</td></tr>
      <tr><td>Hari Kehadiran</td><td>: ${num(w.h)} Hari</td></tr>
      <tr><td>Upah per Hari</td><td>: ${rp(c.tH)}</td></tr>
      <tr><td>Total Upah Kehadiran</td><td>: ${rp(c.hadir)}</td></tr>
      <tr><td>Total Jam Lembur</td><td>: ${esc(fmtLembur(w))}</td></tr>
      <tr><td>Tarif Lembur per Jam</td><td>: ${rp(c.tL)}</td></tr>
      <tr><td>Total Upah Lembur</td><td>: ${rp(c.lembur)}</td></tr>
      <tr><td>Hari Kehadiran Tanggal Merah</td><td>: ${num(w.r) ? num(w.r) + ' Hari' : '-'}</td></tr>
      <tr><td>Tarif Tanggal Merah</td><td>: ${rp(c.tM)}</td></tr>
      <tr><td>Total Upah Tanggal Merah</td><td>: ${rp(c.merah)}</td></tr>
      <tr><td>Potongan</td><td>: ${c.pot ? rp(c.pot) : '-'}</td></tr>
      <tr class="t"><td>TOTAL DITERIMA</td><td>${rp(c.total)}</td></tr>
    </table>
    <div class="ttd">
      <div class="lbl">Tanda Terima,</div>
      <div class="line">( ${esc(w.n)} )</div>
    </div>
  </div>`;
}

async function saveSlipPDF(w) {
  if (!w.n || !w.n.trim()) return alert('Nama pekerja kosong.');
  if (typeof html2pdf === 'undefined') return alert('Library PDF belum siap.');
  
  const host = $('pdfRenderHost');
  host.innerHTML = slipHTML(w);
  
  // Tunggu DOM benar-benar selesai dirender
  window.scrollTo(0, 0);
  await new Promise(r => setTimeout(r, 400));
  
  const el = host.querySelector('.slip');
  const safeName = String(w.n).replace(/[\\/:*?"<>|]+/g, '');
  
  try {
    await html2pdf().set({
      margin: [12, 10, 12, 10],
      filename: `Slip Gaji - ${safeName}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        x: 0, y: 0,
        scrollX: 0, scrollY: 0,
        windowWidth: 720,
        width: 720,
        height: el.scrollHeight
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all'] }
    }).from(el).save();
  } catch (err) {
    console.error(err);
    alert('Gagal membuat PDF. Coba lagi.');
  }
  host.innerHTML = '';
}

function downloadSelectedPDF() {
  const sel = document.getElementById('pdf-select');
  if (!sel || !sel.value) return alert('Pilih nama karyawan terlebih dahulu.');
  const idx = parseInt(sel.value);
  saveSlipPDF(workers[idx]);
}

async function saveAllPDF() {
  const valid = workers.filter(w => w.n && w.n.trim());
  if (!valid.length) return alert('Belum ada pekerja.');
  if (!confirm(`Simpan ${valid.length} file PDF? Browser mungkin meminta izin unduh multiple files.`)) return;
  
  const btn = document.querySelector('button[onclick="saveAllPDF()"]');
  const orig = btn.textContent;
  btn.disabled = true;
  
  for (let i = 0; i < valid.length; i++) {
    btn.textContent = `Menyimpan ${i + 1}/${valid.length}...`;
    await saveSlipPDF(valid[i]);
    await new Promise(r => setTimeout(r, 400));
  }
  
  btn.textContent = orig;
  btn.disabled = false;
  alert('Selesai mengunduh semua PDF.');
}

// Init Data
if (localStorage.getItem(STORE)) {
  workers = JSON.parse(localStorage.getItem(STORE));
} else {
  workers = JSON.parse(JSON.stringify(DEFAULT_WORKERS));
  saveToLocal();
}

drawPage();
</script>
</body>
